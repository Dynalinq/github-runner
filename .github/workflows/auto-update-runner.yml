name: Auto Update Runner Version

on:
  schedule:
    # Run on the 1st of every month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit keep-alive timestamp
        run: |
          # GitHub disables scheduled workflows after 60 days without repository activity
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/last-activity.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-activity.txt
          git commit -m "Build new runner #$(date -u +%Y-%m-%d)"
          git push

      - name: Get latest runner release
        id: get_release
        run: |
          # Fetch the latest release from actions/runner
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/actions/runner/releases/latest | jq -r '.tag_name')
          echo "Latest release: $LATEST_RELEASE"
          
          # Remove the 'v' prefix
          VERSION=${LATEST_RELEASE#v}
          echo "Version without prefix: $VERSION"
          
          # Set output for next step
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$LATEST_RELEASE" >> $GITHUB_OUTPUT

      - name: Trigger build workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/publish-image.yml/dispatches \
            -d '{"ref":"main","inputs":{"runnerVersion":"${{ steps.get_release.outputs.version }}"}}'

      - name: Log completion
        run: |
          echo "Successfully triggered build workflow with runner version ${{ steps.get_release.outputs.version }}"
